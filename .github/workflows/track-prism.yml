name: Track latest Prism

# Keeps the docs site's displayed version (and bundled Prism docs) current by
# bumping `particle-academy/prism` in composer.lock to its newest stable release.
# A push to `main` triggers the site's auto-deploy, so this is fully hands-off:
#   - scheduled daily as a safety net (max ~24h lag),
#   - runnable on demand from the Actions tab, and
#   - triggerable the instant a release ships via a `prism-released` dispatch
#     (wire the Prism release workflow to POST a repository_dispatch here).

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated lock to main
        type: boolean
        default: true
  # Exercise the complete read-only candidate path in contribution CI, while
  # the ordinary Tests and Build runs still exercise their no-input path.
  pull_request:
  repository_dispatch:
    types: [prism-released]

# Never let two bumps race each other.
concurrency:
  group: track-prism
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    # Generated by pin-github-checks.mjs. Code fetched from another repo runs
    # HERE, in a job holding nothing but `contents: read` -- never in a job that
    # can publish or write. bump needs this job, so it still cannot start
    # until the check has passed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `--no-scripts` below stops a package executing on this runner, which is
      # most of the risk — but it does not ask whether the packages being
      # resolved are ones this estate approved, and this job COMMITS the
      # resulting lockfile. An unapproved dependency arriving here lands in the
      # repository rather than only in a container that is about to be thrown
      # away, so the gate stands in front of it like any other install.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: 03de033984603690b9d1ef142899179775d28b22
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: 03de033984603690b9d1ef142899179775d28b22
          PIN_SHA256: |
            4000858467c20cda5ab9af2a9cc3b7eff92a9633ed27a87e2e11837556b3f847  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            720d6d7393e943c599dab248511b8e89f29d51993c31cfaf7bda9292638b74e3  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  controls:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Candidate and publisher controls against a local bare remote
        env:
          TRACK_REQUIRE_SYMLINK_TEST: '1'
        run: php scripts/tests/prism-track-candidate.php

  resolve:
    needs: [guard, controls]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      base: ${{ steps.candidate.outputs.base }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
      artifact_id: ${{ steps.stage.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Resolve the candidate without executing package code
        run: composer update particle-academy/prism --with-all-dependencies --no-interaction --no-install --no-scripts --no-plugins
      - name: Record the exact unapproved candidate
        id: candidate
        run: php scripts/prism-track-candidate.php create "$RUNNER_TEMP/prism-track-staging"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.candidate.outputs.changed == 'true' }}
        id: stage
        with:
          name: prism-track-unapproved-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prism-track-staging/composer.lock
            ${{ runner.temp }}/prism-track-staging/receipt.json
          if-no-files-found: error
          retention-days: 7

  tests:
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    uses: ./.github/workflows/tests.yml
    with:
      candidate_artifact_id: ${{ needs.resolve.outputs.artifact_id }}
      candidate_lock_sha256: ${{ needs.resolve.outputs.candidate_sha256 }}
      candidate_base_sha: ${{ needs.resolve.outputs.base }}

  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    uses: ./.github/workflows/build.yml
    with:
      candidate_artifact_id: ${{ needs.resolve.outputs.artifact_id }}
      candidate_lock_sha256: ${{ needs.resolve.outputs.candidate_sha256 }}
      candidate_base_sha: ${{ needs.resolve.outputs.base }}

  seal:
    needs: [resolve, tests, build]
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.validated.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.base }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          path: ${{ runner.temp }}/prism-track-staging
      - name: Seal only after both reusable workflows succeed
        env:
          TRACK_BASE_SHA: ${{ needs.resolve.outputs.base }}
          TRACK_EXPECTED_SHA256: ${{ needs.resolve.outputs.candidate_sha256 }}
          TRACK_ARTIFACT_ID: ${{ needs.resolve.outputs.artifact_id }}
          TRACK_TESTS_RESULT: ${{ needs.tests.result }}
          TRACK_BUILD_RESULT: ${{ needs.build.result }}
        run: php scripts/prism-track-candidate.php seal "$RUNNER_TEMP/prism-track-staging" "$RUNNER_TEMP/prism-track-validated"
      - uses: actions/upload-artifact@v4
        id: validated
        with:
          name: prism-track-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prism-track-validated/composer.lock
            ${{ runner.temp }}/prism-track-validated/receipt.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, tests, build, seal]
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) && needs.tests.result == 'success' && needs.build.result == 'success' && needs.seal.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.base }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.seal.outputs.artifact_id }}
          path: ${{ runner.temp }}/prism-track-validated
      - name: Publish only the validated lock if main is unchanged
        env:
          TRACK_BASE_SHA: ${{ needs.resolve.outputs.base }}
          TRACK_EXPECTED_SHA256: ${{ needs.resolve.outputs.candidate_sha256 }}
          TRACK_ARTIFACT_ID: ${{ needs.seal.outputs.artifact_id }}
          TRACK_STAGING_ARTIFACT_ID: ${{ needs.resolve.outputs.artifact_id }}
          TRACK_TESTS_RESULT: ${{ needs.tests.result }}
          TRACK_BUILD_RESULT: ${{ needs.build.result }}
          GIT_TERMINAL_PROMPT: '0'
        # GITHUB_TOKEN pushes do not start another Tests run. The exact lock
        # already passed the reusable Tests and Build workflows in this attempt.
        # No PAT, dependency installation or candidate package code in this job.
        run: php scripts/prism-track-candidate.php publish "$RUNNER_TEMP/prism-track-validated"
