name: Port docs

# The TypeScript and Python examples in resources/docs/ports are the only
# documentation here that nothing else compiles. The PHP pages come from the
# installed package and are exercised by its own suite; these are written by
# hand against two libraries that move in their own repositories, so without
# this job they rot silently and a reader copies an example that has not worked
# for weeks.
#
# It checks the ports' MAIN branches rather than their released versions, so an
# example the ports are about to break fails here while the change is still
# somebody's open branch.

on:
  push:
    branches: [main]
  pull_request:
  # The ports move without touching this repository, so the weekly run is what
  # catches an example THEY broke rather than one a change here did.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  examples:
    name: Port examples compile and import
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Under the workspace, not beside it: actions/checkout refuses a path
      # outside GITHUB_WORKSPACE. The checker takes both roots as arguments, so
      # a contributor keeps their siblings and CI keeps .ports/ without either
      # layout being special-cased in the script.
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-ts
          path: .ports/prism-ts
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-py
          path: .ports/prism-py
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gating what is ACTUALLY installed, which is not this repo. The install
      # below is the PORT's dependency tree, so the check is pointed at the
      # port's manifest — `--repo .` here would approve prism-sandbox's
      # dependencies while npm ci ran somebody else's lifecycle scripts on this
      # runner. The port gates itself in its own CI too; this is the copy that
      # stands where this install happens.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          PIN_SHA256: |
            b6ce9746345825e37beb9655e1b124c706cf5451e960b7ee3e548fa3a086f706  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            720d6d7393e943c599dab248511b8e89f29d51993c31cfaf7bda9292638b74e3  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      # DO NOT "simplify" this to `--repo .`. The path is the only thing tying
      # this gate to the tree it guards, and nothing checks that it is the right
      # one: `--repo .` beside an `npm ci` reads as correctly gated to every
      # tool and to most readers, while approving prism-sandbox's dependencies
      # and installing prism-ts's.
      - name: Third-party dependency allowlist (the TypeScript port)
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .ports/prism-ts
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      # The checker typechecks against prism-ts's OWN typescript and @types, so
      # the port's dependencies are installed rather than a copy pulled in here
      # that could differ from what the port compiles with.
      - name: Install the TypeScript port's dependencies
        working-directory: .ports/prism-ts
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          # The Python half of the checker needs 3.11+ for contextlib.chdir.
          # The port itself supports 3.10; this is the runner's floor, not the
          # package's. It reads the port from source and installs nothing.
          python-version: '3.12'

      # No provider requests: TypeScript is typechecked, and the Python
      # examples run under an audit hook that refuses socket access. This needs
      # no key and cannot bill anyone.
      - name: Check the port examples
        run: node scripts/check-port-docs.mjs .ports/prism-ts .ports/prism-py
